<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(135deg, #0f172a, #1e1b4b); color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }
    h1 { font-size: clamp(3rem, 8vw, 5rem); margin-bottom: 1.5rem; text-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: default; }
    .bounce { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-20px) rotate(2deg); } }
    button { padding: 1rem 2.5rem; font-size: 1.2rem; font-weight: 600; color: #fff; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); transition: all 0.3s ease; }
    button:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 15px 30px -5px rgba(168, 85, 247, 0.6); }
    button:active { transform: translateY(1px) scale(0.98); }
    .particle { position: absolute; width: 10px; height: 10px; background: #a855f7; border-radius: 50%; pointer-events: none; animation: pop 0.8s ease-out forwards; }
    @keyframes pop { to { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; } }
  </style>
</head>
<body>
  <h1 id="title" class="bounce">Hello World!</h1>
  <button onclick="burst(event)">Click for Magic ✨</button>

  <script>
    const title = document.getElementById('title');
    function burst(e) {
      title.style.transform = `scale(${1 + Math.random() * 0.4}) rotate(${(Math.random() - 0.5) * 20}deg)`;
      for (let i = 0; i < 12; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = e.clientX + 'px'; p.style.top = e.clientY + 'px';
        p.style.setProperty('--dx', (Math.random() - 0.5) * 200 + 'px');
        p.style.setProperty('--dy', (Math.random() - 0.5) * 200 + 'px');
        p.style.background = `hsl(${Math.random() * 360}, 100%, 70%)`;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }
  </script>
</body>
</html>
